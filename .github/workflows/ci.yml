# Build, unit tests and every static check (gofmt, vet, skill / README_resources.md drift,
# genskill -strict, tfplugindocs validate), the kreuzwerker parity check, then the dind
# end-to-end run (required once test/harness/CI_GREEN_RUNS >= 2). No secrets needed.
# On Windows the same steps are Invoke-Build Build, Test, Check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      e2e_required: ${{ steps.e2e_gate.outputs.e2e_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The e2e job is advisory (continue-on-error) until test/harness/CI_GREEN_RUNS exists
      # and holds an integer >= 2 (bump it by hand after each green e2e run in CI).
      - name: e2e gate (test/harness/CI_GREEN_RUNS)
        id: e2e_gate
        shell: bash
        run: |
          required=false
          f=test/harness/CI_GREEN_RUNS
          if [ -f "$f" ]; then
            n="$(tr -d '[:space:]' < "$f")"
            if [[ "$n" =~ ^[0-9]+$ ]] && [ "$((10#$n))" -ge 2 ]; then
              required=true
            fi
            echo "$f = '$n'"
          else
            echo "$f not found"
          fi
          echo "e2e_required=$required" >> "$GITHUB_OUTPUT"
          echo "e2e required: $required"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # tfplugindocs and the terraform-driven unit tests run the terraform CLI.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: make build
        run: make build

      - name: go vet
        run: go vet ./...

      - name: make test
        run: make test

      # gofmt, vet, genskill -check (.claude/skills, docker-cli-map, README_resources.md), genskill -strict,
      # tfplugindocs validate.
      - name: make check
        run: make check

      # kreuzwerker/docker v4.6.0 parity table; fails when a type marked missing in
      # tools/parity/parity.go has no [BLOCKED] line naming it in BUILD_REPORT.md.
      - name: parity
        run: go run ./tools/parity -check BUILD_REPORT.md

      # Docker Engine API drift: fails when the newest published spec (docs.docker.com,
      # probed upward from the pinned version) differs from tools/apiwatch/pinned.json.
      # Fix: go run ./tools/apiwatch -todo, file the lines in BUILD_REPORT.md, then -update.
      - name: apiwatch
        run: go run ./tools/apiwatch -check

  e2e:
    runs-on: ubuntu-latest
    needs: check
    # Advisory until test/harness/CI_GREEN_RUNS holds an integer >= 2 (see the e2e gate step
    # of the check job); then a failing e2e fails the workflow.
    continue-on-error: ${{ needs.check.outputs.e2e_required != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # terraform-plugin-testing drives the real terraform binary.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Brings up the dind manager + two workers (test/harness), runs TestAccE2E, tears down.
      - name: make e2e
        run: |
          set -o pipefail
          mkdir -p test/harness/out
          make e2e 2>&1 | tee test/harness/out/e2e.log

      - name: upload e2e output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-output
          path: |
            test/harness/out/
            test/harness/*.log
          if-no-files-found: ignore
