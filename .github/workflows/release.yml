# Release: on a pushed v* tag, GoReleaser builds, GPG-signs and publishes the GitHub release the
# Terraform Registry ingests; a second job signs the SHA256SUMS keyless with cosign (GitHub OIDC),
# keeps the Sigstore bundle as a workflow artifact and attaches SLSA build provenance. See RELEASING.md.
# Only GoReleaser uploads release assets. The registry rejects any release asset besides the zips,
# <name>_<version>_manifest.json, _SHA256SUMS and _SHA256SUMS.sig ("invalid file extension found: json"
# for the v0.1.0 .sigstore.json), so no other step may upload to the release: Invoke-Build ReleaseCheck
# parses this file and fails on a step that uploads any other file to it.
# Every action is pinned by commit SHA (comment = the tag it resolves to).
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

  sign:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read # download release assets (this job never uploads to the release)
      id-token: write # cosign keyless signing and provenance (GitHub OIDC)
      attestations: write # actions/attest-build-provenance
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download release assets
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sums="terraform-provider-docker_${version}_SHA256SUMS"
          echo "SUMS=${sums}" >> "$GITHUB_ENV"
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern '*.zip' --pattern "${sums}" --pattern '*_manifest.json'
          ls -l dist
          cd dist
          sha256sum --check --strict "${sums}"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign SHA256SUMS keyless (cosign, GitHub OIDC)
        working-directory: dist
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "${SUMS}.sigstore.json" "${SUMS}"

      # A workflow artifact, never a release asset (see the header). RELEASING.md: download and verify.
      - name: Keep the cosign bundle as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cosign-bundle-${{ github.ref_name }}
          path: dist/${{ env.SUMS }}.sigstore.json
          if-no-files-found: error
          retention-days: 90

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*_SHA256SUMS
            dist/*_manifest.json
