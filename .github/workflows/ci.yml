# Invoke-Build (terraform-provider-docker.build.ps1) is the only entry point, locally and here: every
# step below is an Invoke-Build task, so `Invoke-Build <same tasks>` on any machine reproduces CI.
# Check job, in order: the default task (Build, Vet, Test and the generated-content checks), Check
# (gofmt, vet, genskill -check/-strict, tfplugindocs validate), ParityCheck + GuideCheck, ApiWatchCheck.
# Then the dind end-to-end run through test/harness/Invoke-E2E.ps1 (Invoke-Build E2E), required once
# test/harness/CI_GREEN_RUNS >= 2. No secrets needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned Invoke-Build module version (PowerShell Gallery).
  INVOKE_BUILD_VERSION: 5.14.23

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      e2e_required: ${{ steps.e2e_gate.outputs.e2e_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The e2e job is advisory (continue-on-error) until test/harness/CI_GREEN_RUNS exists
      # and holds an integer >= 2 (bump it by hand after each green e2e run in CI).
      - name: e2e gate (test/harness/CI_GREEN_RUNS)
        id: e2e_gate
        shell: bash
        run: |
          required=false
          f=test/harness/CI_GREEN_RUNS
          if [ -f "$f" ]; then
            n="$(tr -d '[:space:]' < "$f")"
            if [[ "$n" =~ ^[0-9]+$ ]] && [ "$((10#$n))" -ge 2 ]; then
              required=true
            fi
            echo "$f = '$n'"
          else
            echo "$f not found"
          fi
          echo "e2e_required=$required" >> "$GITHUB_OUTPUT"
          echo "e2e required: $required"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # tfplugindocs and the terraform-driven unit tests run the terraform CLI.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # pwsh (PowerShell 7) and python3 ship on the GitHub ubuntu runners; the build script
      # falls back to python3 when `python` is not on PATH (Inventory, InventoryValidate).
      - name: Install InvokeBuild
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module InvokeBuild -RequiredVersion $env:INVOKE_BUILD_VERSION -Scope CurrentUser -Force
          Get-Module -ListAvailable InvokeBuild | Select-Object Name, Version

      # Default task: Build, Vet, Test (unit, -short, TF_ACC unset), GenSkillCheck, InventoryCheck,
      # InventoryValidate, RegistryCheck, ContractCheck, DocCountsCheck. A task added to the default
      # list in terraform-provider-docker.build.ps1 runs here without a workflow change.
      - name: Invoke-Build (default task)
        shell: pwsh
        run: Invoke-Build

      # gofmt, vet, genskill -check (.claude/skills, docker-cli-map, README_resources.md),
      # genskill -strict, tfplugindocs validate. Runs every step, then lists the failures.
      - name: Invoke-Build Check
        shell: pwsh
        run: Invoke-Build Check

      # kreuzwerker/docker v4.6.0 parity: types and every attribute against reference/_gen/renames.json;
      # fails when a type marked missing has no [BLOCKED] line naming it in BUILD_REPORT.md. GuideCheck:
      # the migration guide template matches renames.json.
      - name: Invoke-Build ParityCheck, GuideCheck
        shell: pwsh
        run: Invoke-Build ParityCheck, GuideCheck

      # Docker Engine API drift: fails when the newest published spec (docs.docker.com, probed upward
      # from the pinned version) differs from tools/apiwatch/pinned.json. Last, because it is the only
      # step that needs the network. Fix: see .claude/skills/engine-api-watch/SKILL.md.
      - name: Invoke-Build ApiWatchCheck
        shell: pwsh
        run: Invoke-Build ApiWatchCheck

  e2e:
    runs-on: ubuntu-latest
    needs: check
    # Advisory until test/harness/CI_GREEN_RUNS holds an integer >= 2 (see the e2e gate step
    # of the check job); then a failing e2e fails the workflow.
    continue-on-error: ${{ needs.check.outputs.e2e_required != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # terraform-plugin-testing drives the real terraform binary.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Install InvokeBuild
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module InvokeBuild -RequiredVersion $env:INVOKE_BUILD_VERSION -Scope CurrentUser -Force

      # test/harness/Invoke-E2E.ps1 (PowerShell 7): harness up (dind manager + workers, registry),
      # TestAccE2E with TF_ACC=1, output tee'd to test/harness/last-e2e.log, harness down.
      - name: Invoke-Build E2E
        shell: pwsh
        run: Invoke-Build E2E

      - name: upload e2e output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-output
          path: |
            test/harness/out/
            test/harness/*.log
          if-no-files-found: ignore
