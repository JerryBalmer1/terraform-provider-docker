command: docker compose up
short: Create and start containers (reworded)
usage: docker compose up [OPTIONS] [SERVICE...]
pname: docker compose
options:
    - option: build
      value_type: bool
      default_value: "false"
      description: Build images before starting containers
      deprecated: false
      hidden: false
    - option: detach
      shorthand: d
      value_type: bool
      default_value: "false"
      description: Detached mode
      deprecated: false
      hidden: false
inherited_options:
    - option: dry-run
      value_type: bool
      default_value: "false"
