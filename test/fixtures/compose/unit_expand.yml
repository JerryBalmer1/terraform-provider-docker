# ComposeParity replacement for internal/provider/testdata/compose_hash/unit_expand.yml
# (source: composeExpandYAML in internal/provider/compose_parse_test.go).
# Same services and features; on dind:
# - web runs 1 replica, not 2: it pins ipv4_address and a fixed host port,
#   which two containers on one daemon cannot share;
# - the file secret is an absolute path on the harness daemon host
#   (${PARITY_DIR}, staged by the test), not a Windows client path;
# - the local tmpfs volume names its device, which the local driver requires;
# - the long-syntax tmpfs mount moves from web to job: the Engine fails
#   volumes_from (sidecar) of a container with a tmpfs mount ("get: no such
#   volume", it looks the tmpfs up as a volume with an empty name).
# The external network traefik_public is created by the test.
services:
  web:
    image: nginx:1.27
    command: ["nginx", "-g", "daemon off;"]
    ports: ["127.0.0.1:8080:80", "9000/udp"]
    expose: ["3000"]
    environment: {A: "1", UNSET: null}
    labels: {team: web}
    restart: on-failure:3
    mem_limit: 64m
    cpus: 0.5
    healthcheck: {disable: true}
    volumes:
      - data:/data
    secrets:
      - source: pw
        target: custom
        uid: "100"
        gid: "101"
        mode: 0400
      - file_secret
    configs: [conf]
    extra_hosts: ["db.local:10.0.0.2"]
    networks:
      front: {aliases: [www], ipv4_address: 172.30.0.10}
      back: {}
    deploy: {replicas: 1}
  sidecar:
    image: busybox
    network_mode: service:web
    volumes_from: [web:ro]
    deploy:
      mode: global
      restart_policy: {condition: none}
      resources: {limits: {memory: 32m}}
  job:
    image: busybox
    container_name: the-job
    volumes:  # parity: moved from web (see the header)
      - type: tmpfs
        target: /tmp
        tmpfs: {size: 1048576}
    networks: [ext]
    deploy:
      mode: replicated-job
networks:
  front:
    ipam: {config: [{subnet: 172.30.0.0/24}]}
  back: {internal: true}
  ext: {external: true, name: traefik_public}
volumes:
  data: {driver: local, driver_opts: {type: tmpfs, device: tmpfs}}  # parity: the local driver needs a device
secrets:
  pw: {environment: PW}
  file_secret: {file: "${PARITY_DIR}/pw.txt"}
configs:
  conf: {content: "x=1"}
