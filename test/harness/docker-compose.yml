# Test harness ONLY: a Docker-in-Docker swarm (one manager, three workers),
# a registry:2, and a TLS-enabled standalone dind daemon, used by `make e2e`,
# Invoke-Build TestAcc and the TestAcc* acceptance tests. This is the only
# compose file in the repository; the provider itself never uses compose or
# the docker CLI.
#
# SECURITY: manager and workers listen on plain TCP 2375 WITHOUT TLS. That is
# acceptable only because this is a throwaway local harness and the ports are
# published on 127.0.0.1 exclusively. Never copy this setup anywhere else.
# The tlsnode daemon uses throwaway certificates generated by harness-up into
# test/harness/tls/ (git-ignored).
name: tfdocker-e2e

x-dind: &dind
  image: docker:28-dind
  privileged: true
  environment:
    # Empty cert dir disables dind's auto-generated TLS (harness-only).
    DOCKER_TLS_CERTDIR: ""
  command:
    - --host=tcp://0.0.0.0:2375
    - --host=unix:///var/run/docker.sock
    # The registry service below shares the manager's network namespace;
    # every node can reach it as manager:12380 over swarmnet (plain http).
    - --insecure-registry=manager:12380
    # Docker Hub pulls go through the pull-through cache below first.
    - --registry-mirror=http://mirror:5000
  networks:
    - swarmnet
  # Fresh /run on every (re)start: dockerd/containerd pid files there survive
  # `compose restart`/`stop`+`start` otherwise, and a reused PID makes the
  # restarted daemon exit with "failed to save daemon pid to disk: process
  # with PID N is still running". Tests restart worker2 and tlsnode.
  tmpfs:
    - /run
  healthcheck:
    test: ["CMD", "docker", "info"]
    interval: 3s
    timeout: 5s
    retries: 40
    start_period: 5s
  restart: "no"

services:
  manager:
    <<: *dind
    hostname: manager
    ports:
      - "127.0.0.1:12375:2375"
      # registry (network_mode service:manager) listens on 12380 in this
      # namespace: the host and the manager daemon both use 127.0.0.1:12380.
      - "127.0.0.1:12380:12380"
    volumes:
      - manager-data:/var/lib/docker

  worker1:
    <<: *dind
    hostname: worker1
    ports:
      - "127.0.0.1:12376:2375"
    volumes:
      - worker1-data:/var/lib/docker

  worker2:
    <<: *dind
    hostname: worker2
    ports:
      - "127.0.0.1:12377:2375"
    volumes:
      - worker2-data:/var/lib/docker

  # NVIDIA-shaped worker for placement tests. There is no GPU: the daemon only
  # advertises an engine label (engine.labels.gpu==nvidia) and a swarm generic
  # resource NVIDIA-GPU=GPU-0, the way nvidia-container-toolkit hosts do.
  worker3:
    <<: *dind
    hostname: worker3
    command:
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
      - --insecure-registry=manager:12380
      - --registry-mirror=http://mirror:5000
      - --label=gpu=nvidia
      - --node-generic-resource=NVIDIA-GPU=GPU-0
    ports:
      - "127.0.0.1:12379:2375"
    volumes:
      - worker3-data:/var/lib/docker

  # registry:2 with deletes enabled (docker_registry_image keep_remotely=false
  # issues DELETE /v2/<repo>/manifests/<digest>). It runs inside the manager's
  # network namespace so one name, 127.0.0.1:12380, works from the host (the
  # provider's DELETE) and from the manager daemon (push/pull; loopback
  # registries are insecure by default). Workers use manager:12380.
  registry:
    image: registry:2
    network_mode: "service:manager"
    depends_on:
      manager:
        condition: service_started
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_ADDR: "0.0.0.0:12380"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:12380/v2/"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 3s
    restart: "no"

  # Pull-through cache of Docker Hub (registry:2 proxy mode), the dind nodes'
  # --registry-mirror. Every harness-up starts fresh daemons that would pull
  # nginx/busybox/alpine again on every node; anonymous Hub pulls are limited
  # per IP (100 per hour measured), which back-to-back full runs exhausted.
  # Its volume is EXTERNAL (created by harness-up, kept by harness-down -v),
  # so the cache survives between runs. Delete it with
  # `docker volume rm tfdocker-e2e-mirror-cache`.
  mirror:
    image: registry:2
    hostname: mirror
    environment:
      REGISTRY_PROXY_REMOTEURL: "https://registry-1.docker.io"
      REGISTRY_HTTP_ADDR: "0.0.0.0:5000"
    networks:
      - swarmnet
    volumes:
      - mirror-cache:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 3s
    restart: "no"

  # Standalone dind daemon that only accepts mutual TLS on 2376 (published as
  # 127.0.0.1:12378). Certificates come from test/harness/tls/, generated by
  # harness-up before `compose up`. Not part of the swarm.
  tlsnode:
    image: docker:28-dind
    privileged: true
    hostname: tlsnode
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2376
      - --host=unix:///var/run/docker.sock
      - --tlsverify
      - --tlscacert=/tls/ca.pem
      - --tlscert=/tls/server-cert.pem
      - --tlskey=/tls/server-key.pem
      - --registry-mirror=http://mirror:5000
    networks:
      - swarmnet
    ports:
      - "127.0.0.1:12378:2376"
    tmpfs:
      - /run
    volumes:
      - tlsnode-data:/var/lib/docker
      - ./tls:/tls:ro
    healthcheck:
      test: ["CMD", "docker", "-H", "unix:///var/run/docker.sock", "info"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    restart: "no"

networks:
  # Workers reach the manager's swarm port at manager:2377 over this network.
  swarmnet:
    driver: bridge

volumes:
  manager-data:
  worker1-data:
  worker2-data:
  worker3-data:
  tlsnode-data:
  mirror-cache:
    external: true
    name: tfdocker-e2e-mirror-cache
