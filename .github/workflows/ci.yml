# Build, unit tests and every static check (gofmt, vet, skill / README_resources.md drift,
# genskill -strict, tfplugindocs validate), then the dind end-to-end run. No secrets needed.
# On Windows the same steps are ./build.ps1 -Task build,test,check.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # tfplugindocs and the terraform-driven unit tests run the terraform CLI.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: make build
        run: make build

      - name: go vet
        run: go vet ./...

      - name: make test
        run: make test

      # gofmt, vet, genskill -check (skill + README_resources.md), genskill -strict,
      # tfplugindocs validate.
      - name: make check
        run: make check

  e2e:
    runs-on: ubuntu-latest
    needs: check
    # Remove once proven green twice: the dind harness has not run in CI yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # terraform-plugin-testing drives the real terraform binary.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Brings up the dind manager + two workers (test/harness), runs TestAccE2E, tears down.
      - name: make e2e
        run: |
          set -o pipefail
          mkdir -p test/harness/out
          make e2e 2>&1 | tee test/harness/out/e2e.log

      - name: upload e2e output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-output
          path: |
            test/harness/out/
            test/harness/*.log
          if-no-files-found: ignore
